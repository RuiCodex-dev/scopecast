<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<style>
@font-face { font-family: "Fraunces"; src: url("../../video/hyperframes/fonts/fraunces-latin-500-normal.woff2"); font-weight: 500; }
@font-face { font-family: "Fraunces"; src: url("../../video/hyperframes/fonts/fraunces-latin-400-italic.woff2"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Plex"; src: url("../../video/hyperframes/fonts/ibm-plex-sans-latin-400-normal.woff2"); }
@font-face { font-family: "Plex"; src: url("../../video/hyperframes/fonts/ibm-plex-sans-latin-600-normal.woff2"); font-weight: 600; }
* { margin: 0; box-sizing: border-box; }
body { width: var(--w); height: var(--h); overflow: hidden; position: relative; font-family: "Plex"; color: #1F1C17; }
img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
.card { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); width: 48%; padding: 4.2% 4.4%; background: rgba(251,249,244,0.95); border: 1px solid #CFC6B4; }
.lock { display: flex; align-items: center; gap: 0.35em; font-family: "Fraunces"; font-weight: 500; font-size: calc(var(--w) * 0.062); letter-spacing: -0.02em; line-height: 1; }
.lock svg { width: 0.9em; height: 0.9em; }
.tag { margin-top: 0.7em; font-family: "Fraunces"; font-style: italic; font-size: calc(var(--w) * 0.03); color: #9A4024; line-height: 1.2; }
.fact { margin-top: 1.2em; font-size: calc(var(--w) * 0.017); color: #5C574E; line-height: 1.45; }
.fact b { color: #1F1C17; font-weight: 600; }
</style></head>
<body>
<img class="bg" src="../img/plate-desk.jpg" alt="" />
<div class="card">
  <div class="lock"><svg viewBox="0 0 32 32"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="#1F1C17"/><path d="M7 24 C 13 24, 13.5 8.5, 25 8" stroke="#F3EEE4" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="19" y1="6" x2="19" y2="26" stroke="#B8502E" stroke-width="1.6" stroke-dasharray="1.5 2.2"/><circle cx="19" cy="10.6" r="2.4" fill="#B8502E"/></svg>Scopecast</div>
  <p class="tag">Quote fixed-price work with a confidence level you choose.</p>
  <p class="fact"><b>€12,050 at 80%</b> · 8,000 of 10,000 simulated runs within 142 hours</p>
</div>
</body></html>
